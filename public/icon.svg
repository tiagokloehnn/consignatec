<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131F" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Primary 'C' Monogram Arc Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Upward Growth Arrow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Subtle Drop Shadow for 3D Elevation -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Inner Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Sleek Border -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6" />
  
  <!-- Subtle Ambient Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)" />

  <!-- Main Consignatec Monogram Mark -->
  <g filter="url(#markShadow)">
    <!-- Stylized Modern 'C' Arc -->
    <!-- Sweeps from top-right down through left and curves to bottom-right -->
    <path d="M 330 148 
             A 140 140 0 1 0 354 362 
             L 306 322 
             A 84 84 0 1 1 292 190 
             Z" 
          fill="url(#tealGrad)" />

    <!-- Upward Growth Arrow (Chevron Head) representing Financial Ascension -->
    <path d="M 276 132 
             L 372 132 
             L 372 228 
             L 332 188 
             L 254 266 
             L 214 226 
             L 296 144 
             Z" 
          fill="url(#emeraldGrad)" />

    <!-- Core Dot / Smart Finance Node -->
    <circle cx="214" cy="226" r="14" fill="#FFFFFF" />
    <circle cx="372" cy="132" r="12" fill="#FDE047" />
  </g>
</svg>
